<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock &amp; Connect — Private Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1b3d; --navy-2:#162450; --accent:#d9a62c; --accent-ink:#2a2003;
    --fg:#eef1fb; --fg-dim:#b9c0dd; --danger:#ff7a6e; --ok:#52d98a;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:linear-gradient(160deg, var(--navy), var(--navy-2));
    color:var(--fg);
    font-family:'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .gate{
    width:100%; max-width:360px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12); border-radius:16px;
    padding:32px 26px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .lock-badge{
    width:56px; height:56px; border-radius:50%; margin:0 auto 18px;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(217,166,44,.35);
  }
  .lock-badge svg{width:26px; height:26px; fill:var(--accent-ink)}
  h1{font-family:'Bricolage Grotesque', sans-serif; font-size:22px; margin:0 0 6px}
  p.sub{color:var(--fg-dim); font-size:13px; line-height:1.5; margin:0 0 24px}
  .field{text-align:left; margin-bottom:16px}
  label{display:block; font-size:12px; color:var(--fg-dim); margin-bottom:6px}
  .pw-row{position:relative}
  input{
    width:100%; padding:12px 44px 12px 14px; border-radius:10px;
    border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
    color:#fff; font-size:15px; outline:none;
  }
  input:focus{border-color:var(--accent)}
  .toggle{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--fg-dim); font-size:12px; cursor:pointer; padding:6px;
  }
  .submit{
    width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px;
    font-family:'Figtree', sans-serif;
  }
  .submit:active{transform:scale(.98)}
  .msg{min-height:20px; margin-top:12px; font-size:13px; color:var(--danger)}
  .footer{margin-top:18px; font-size:11px; color:var(--fg-dim)}
</style>
</head>
<body>
  <div class="gate">
    <div class="lock-badge">
      <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h1zm2 0h8V8a4 4 0 0 0-8 0v2zm4 5a1.5 1.5 0 0 1 1 2.6V19h-2v-1.4a1.5 1.5 0 0 1 1-2.6z"/></svg>
    </div>
    <h1>Private preview</h1>
    <p class="sub">This prototype is shared with investors by invitation only. Enter the password you were given to continue.</p>
    <div class="field">
      <label for="pw">Password</label>
      <div class="pw-row">
        <input id="pw" type="password" placeholder="Enter password" autocomplete="off" />
        <button class="toggle" id="toggleBtn" type="button">Show</button>
      </div>
    </div>
    <button class="submit" id="submitBtn">Unlock prototype</button>
    <div class="msg" id="msg"></div>
    <div class="footer">Lock &amp; Connect &middot; shared for investor review only</div>
  </div>

  <script>
    var PASSWORD = "LockConnect2026";
    var pw = document.getElementById('pw');
    var msg = document.getElementById('msg');
    var submitBtn = document.getElementById('submitBtn');
    var toggleBtn = document.getElementById('toggleBtn');

    function tryUnlock(){
      var val = (pw.value || '').trim();
      if (!val){
        msg.textContent = 'Enter the password to continue.';
        return;
      }
      if (val === PASSWORD){
        try { sessionStorage.setItem('lc_unlocked', '1'); } catch(e){}
        window.location.href = 'app.html';
      } else {
        msg.textContent = 'That password is not correct. Check with the founder for the current one.';
      }
    }

    submitBtn.addEventListener('click', tryUnlock);
    pw.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });
    toggleBtn.addEventListener('click', function(){
      if (pw.type === 'password'){ pw.type = 'text'; toggleBtn.textContent = 'Hide'; }
      else { pw.type = 'password'; toggleBtn.textContent = 'Show'; }
    });
  </script>
</body>
</html>
