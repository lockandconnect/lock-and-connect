<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock &amp; Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9EEF5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6780; --line:#D5DCE8;
  --brand:#14213D; --onbrand:#FFFFFF; --lock:#FFC940; --onlock:#14213D;
  --ok:#12867E; --okbg:#DDF3F0; --bad:#C93B3B; --badbg:#FBE4E4; --late:#B7791F; --latebg:#FCEFD2;
  --shadow:0 1px 2px rgba(20,33,61,.08);
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#16213A; --ink:#EAF0FB; --muted:#9DABC6; --line:#2A3757;
    --brand:#FFC940; --onbrand:#14213D; --lock:#FFC940; --onlock:#14213D;
    --okbg:#12342F; --badbg:#3B1D22; --latebg:#3A2F14; --ok:#4FD1C5; --bad:#FF8A8A; --late:#F6C761;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#16213A; --ink:#EAF0FB; --muted:#9DABC6; --line:#2A3757;
  --brand:#FFC940; --onbrand:#14213D; --lock:#FFC940; --onlock:#14213D;
  --okbg:#12342F; --badbg:#3B1D22; --latebg:#3A2F14; --ok:#4FD1C5; --bad:#FF8A8A; --late:#F6C761;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lock);outline-offset:2px}
.phone{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px){.phone{height:min(880px,100%);margin:auto;border-radius:28px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(20,33,61,.18)}}
.top{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font:800 22px/1.1 var(--head);margin:0}
.top small{color:var(--muted);display:block;font-size:12px}
.top>div:first-child{min-width:0}
.top .chip{white-space:nowrap;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font:800 17px/1.2 var(--head);margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--brand);color:var(--onbrand)}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.lock{background:var(--lock);color:var(--onlock)}
.btn.bad{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:11px 4px 10px;font-weight:600;font-size:13px;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--lock)}
/* dial */
.dial{display:flex;flex-direction:column;align-items:center;padding:2px 0 4px}
.dial svg{width:150px;height:150px}
.dial .big{font:800 34px/1 var(--head)}
.state{font-weight:600;margin-top:6px;text-align:center}
/* apps */
.app{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.app:first-of-type{border-top:0}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:800 15px var(--head);color:#fff}
.app .nm{flex:1;font-weight:600}
.app .st{font-size:12px;color:var(--muted);font-weight:400}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--lock);color:var(--onlock)}
.tag.off{background:var(--line);color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700}
.stepper b{min-width:64px;text-align:center;font:800 18px var(--head)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.note{background:var(--latebg);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px}
.spent{display:flex;justify-content:space-between;align-items:baseline}
.spent b{font:800 26px var(--head)}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
details p,details li{font-size:13px;color:var(--muted)}
/* toast */
.toast{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--brand);color:var(--onbrand);border-radius:14px;padding:11px 14px;font-size:13px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:drop .25s ease-out}
.toast b{display:block}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* modal */
.scrim{position:absolute;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:flex-end;z-index:60}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h2{font:800 20px/1.2 var(--head);margin:0 0 4px}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;margin-top:10px}
.opt b{display:block;font-size:16px}
.opt span{color:var(--muted);font-size:13px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--lock)}
.pin{display:flex;gap:10px;margin:14px 0}
.pin input{width:100%;font:800 24px var(--head);text-align:center;letter-spacing:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* seating grid */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.board{text-align:center;font-size:12px;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:5px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.desk{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:2px;overflow:hidden}
.desk.name-edit{background:var(--bg);gap:3px}
.desk.name-edit small{color:var(--muted);font-weight:700}
.deskname{width:92%;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--surface);color:var(--ink)}
.desk small{font-size:11px;font-weight:600}
.desk.P{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.desk.A{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.desk.L{background:var(--latebg);border-color:var(--late);color:var(--late)}
.desk.E{background:#E6EFFD;border-color:#3B6FD6;color:#3B6FD6}
.desk.C{background:#F3E6FB;border-color:#8A3FBF;color:#8A3FBF}
.desk:disabled{opacity:.7;cursor:default}
.counts{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.counts div,.counts button{flex:1;min-width:60px;border-radius:12px;padding:8px;text-align:center;font-size:12px;font-weight:600;border:none;font-family:inherit;cursor:pointer}
.counts b{display:block;font:800 20px var(--head)}
.log{font-size:13px;color:var(--muted);margin:6px 0 0;padding-left:16px}
input[type=text],textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px}
.q{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.qtools{display:flex;gap:4px}
.qtools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:26px;height:26px;font-size:12px;color:var(--muted)}
.qtools button:disabled{opacity:.35}
.q label{display:flex;align-items:center;gap:8px;margin-top:6px}
.q label input[type=text]{flex:1}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.st-pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.st-pill.ok{background:var(--okbg);color:var(--ok)}
.st-pill.wait{background:var(--latebg);color:var(--late)}
/* chat */
.banner{background:var(--lock);color:var(--onlock);font-weight:700;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.banner.idle{background:var(--line);color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.m{max-width:82%;padding:9px 12px;border-radius:16px;font-size:14px}
.m small{display:block;font-weight:700;font-size:11px;margin-bottom:2px;opacity:.75}
.m.t{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m.s{background:var(--brand);color:var(--onbrand);align-self:flex-end;border-bottom-right-radius:4px}
.compose{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface);align-items:center}
.emojibar{display:flex;gap:6px;padding:8px 16px 0;background:var(--surface);overflow-x:auto}
.emojibtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:38px;height:38px;font-size:18px;flex:none;display:flex;align-items:center;justify-content:center}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:12px;width:40px;height:40px;font-size:18px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.m.photo img{max-width:100%;border-radius:12px;display:block;margin-top:2px}
.m.emoji .bigemoji{font-size:34px;line-height:1.1;display:block}
.compose input{flex:1}
.hint{font-size:12px;color:var(--muted)}
.kidrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kidpill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.kidpill.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.kidpill.add{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:600}
.schedrow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.timerow{display:flex;gap:10px;margin-top:6px}
.timelab{flex:1;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.timelab .timein{width:100%}
.feedlist{margin-top:10px}
.feedcard{padding:12px 14px}
.seg.sm{padding:2px;margin-bottom:8px}
.seg.sm button{padding:6px;font-size:12px}
.post{border-radius:12px;padding:10px;margin-top:8px}
.post:first-child{margin-top:0}
.post.reg{background:#EAF1FF}
.post.sos{background:var(--badbg);border:2px solid var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .post.sos{animation:sosvib .5s ease-in-out 2}
}
@keyframes sosvib{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.post-head{display:flex;align-items:center;gap:8px}
.post-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex:none}
.post-who{display:flex;flex-direction:column}
.post-who b{font-size:12.5px}
.post-who span{font-size:10px;color:var(--muted);font-weight:600}
.post-body{margin:6px 0 0;font-size:12.5px;line-height:1.35}
.post-eng{margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
.seg button.hasnew{background:#2563EB;color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font:800 20px var(--head);color:var(--ink)}
.stat span{font-size:10px;color:var(--muted);font-weight:600;line-height:1.2;display:block;margin-top:2px}
.swlabel{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;width:100%}
.swlabel input[type=checkbox]{width:16px;height:16px}
.timein{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px}
.timein:disabled{opacity:.5}
.navdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);vertical-align:top;margin-left:2px}
.filtergrid{display:flex;flex-direction:column;gap:10px}
.filtercard{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;width:100%}
.filtercard.on{border-color:var(--ok);background:var(--okbg)}
.filtercard:disabled{cursor:default}
.fc-top{display:flex;align-items:center;gap:10px}
.fc-ico{font-size:26px;flex:none}
.fc-top b{display:block;font-size:16px}
.fc-age{font-size:12px;color:var(--muted);font-weight:400}
.fc-check{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.fc-list{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.fc-list li{margin-top:3px}
.swrap{display:flex;align-items:center;gap:8px;flex:none}
.swrap span{font-size:12px;font-weight:700;color:var(--muted)}
.sw{position:relative;width:50px;height:28px;border-radius:999px;border:0;background:var(--line);flex:none;transition:background .15s}
.sw.on{background:var(--ok)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on i{left:25px}
.chip.sosbtn{background:#B3261E;color:#fff;border-color:#B3261E;font-weight:800}
.hold{position:relative;overflow:hidden;width:100%;margin-top:14px;padding:18px;border:0;border-radius:14px;background:#7F1D1D;color:#fff;font-weight:800;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold #holdBar{position:absolute;top:0;bottom:0;left:0;width:0;background:#E5484D}
.hold .ht{position:relative}
.sosfull{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;gap:12px;padding:calc(22px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;color:#fff;background:#B3261E}
.sosfull.drill{background:#8A5A00}
.sosfull.clear{background:#0F6B64}
.sosfull>*{flex:none}
.sosfull h1{font:800 38px/1.05 var(--head);margin:0}
.sosfull p{font-size:17px;margin:0}
.sosfull .skick{font-size:13px;font-weight:600;opacity:.9}
.sosfull .sdrill{background:#fff;color:#8A5A00;font-weight:800;border-radius:10px;padding:8px 12px;text-align:center}
.sosfull .sbtn{border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;background:#fff;color:#7F1D1D}
.sosfull.clear .sbtn{color:#0F6B64}
.sosfull .sbtn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);font-size:15px}
.sosfull .sbtn:disabled{opacity:.75}
.sosfull .sfine,.sosfull .snote{font-size:13px;opacity:.92}
.sosfull .snote{background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px}
.sosfull .scount{font-size:16px}.sosfull .scount b{font:800 30px var(--head)}
.sosfull .desk{color:var(--ink);cursor:default}
.sosfull .desk.P{color:var(--ok)}
.sosfull .slink{margin-top:auto;border:0;background:none;color:#fff;opacity:.75;text-decoration:underline;font-size:12px;padding:8px}
.vault{border:5px solid var(--brand);border-radius:20px;padding:12px;margin-top:12px;background:var(--bg);min-height:96px}
.vault.locked{border-color:var(--lock)}
.vault.myvault{border-style:dashed}
.vault.myvault.locked{border-color:var(--ok)}
.vault .empty{text-align:center;color:var(--muted);margin:14px 0}
.vstat{font-size:12px;font-weight:600;color:var(--muted);margin-top:10px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 7px;border:1px solid var(--line);background:var(--surface);border-radius:14px;min-width:0}
.tile .tn{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.in{border-color:var(--brand)}
.tile.lk{opacity:.85}
.tile .badge{position:absolute;top:2px;right:4px;font-size:11px}
.tile.pop{animation:pop .35s ease-out}
.tilebtn{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;border:0;background:none;padding:0;min-width:0}
.tilebtn:disabled{opacity:.6}
.tilex{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;border:2px solid var(--surface);font-size:13px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.tileout{width:100%;border:0;background:none;color:var(--bad);font-size:10.5px;font-weight:700;padding:3px 0 0;cursor:pointer;text-decoration:underline}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tile.pop{animation:none}}
.field{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)!important;font-family:inherit;font-size:16px;font-weight:400}
input,textarea,select{color:var(--ink)!important}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active,textarea:-webkit-autofill,select:-webkit-autofill{
  -webkit-text-fill-color:var(--ink)!important;
  -webkit-box-shadow:0 0 0 1000px var(--surface) inset!important;
  box-shadow:0 0 0 1000px var(--surface) inset!important;
  caret-color:var(--ink);
}
.linklike{border:0;background:none;color:var(--brand);font-weight:700;text-decoration:underline;padding:0;font:inherit;cursor:pointer}
.lab{display:block;margin-top:12px;font-weight:600;font-size:13px}
.alertbox{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:10px}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:8px 0}
</style>
</head>

<script>
'use strict';

/* ---------- Mode logic ---------- */
function hoursBetween(start, end){
  const [sh,sm] = start.split(':').map(Number), [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 24*60;
  return mins/60;
}
function startMode(type){
  if(isViewer()){ say('View only', S.names.parent+' needs to make this change.'); return; }
  if(!settingsOpen()){ askSettingsPin(); return; }
  const sc = kid().schedule;
  const hrs = type==='study' ? hoursBetween(sc.studyStart, sc.studyEnd) : hoursBetween(sc.bedStart, sc.bedEnd);
  kid().active = {type, hrs, elapsed:0};
  render();
}
function skip(m){ if(kid().active){ kid().active.elapsed = Math.min(kid().active.hrs*60, kid().active.elapsed+m); if(kid().active.elapsed>=kid().active.hrs*60){ kid().active=null; say('Lock finished','The Vault opened on its own.'); return;} render(); } }

}

  const need = f==='admin' ? ADMIN_PIN : PIN;
  if(Date.now() < S.pinLockUntil){ S.pinErr = 'Too many wrong tries. Try again in ' + Math.ceil((S.pinLockUntil-Date.now())/1000) + ' seconds.'; render(); return; }
  if(v !== need){
    S.pinFails++;
    if(S.pinFails >= 3){ S.pinFails = 0; S.pinLockUntil = Date.now()+30000; S.pinErr = 'Too many wrong tries. Locked for 30 seconds.'; }
    else S.pinErr = 'Wrong PIN. Try again.' + (need==='1234'||need==='9999' ? ' (demo PIN: '+need+')' : '');
    render(); return;
  }
  S.pinFails = 0; S.pinFor = null;
  if(f==='login'){ S.modal=null; unlockSettings(); signIn(S.loginRole||'parent'); return; }
  if(f==='settings'){ S.modal=null; unlockSettings(); render(); say('Settings unlocked','You can change protected settings for 2 minutes.'); return; }
  if(f==='admin'){
    const action = S.adminAction; S.adminAction=null; S.modal=null;
    if(action==='clear') doSendClear();
    else if(action==='announce') doPostAnnouncement();
    render(); return;
  }
  if(S.pendingRemove){ const n = S.pendingRemove; const ap = kid().phone.find(a=>a.n===n); if(ap) ap.v=false; S.modal=null; S.pendingRemove=null; render(); say('Taken out of the vault', n + ' is no longer protected.'); return; }
  if(S.pendingRemoveMe){ const n = S.pendingRemoveMe; const ap = S.me.apps.find(a=>a.n===n); if(ap) ap.v=false; S.modal=null; S.pendingRemoveMe=null; render(); say('Taken out of your vault', n + ' is no longer protected.'); return; }
  kid().active = null; S.modal = null; render(); say('Vault unlocked','Unlocked with PIN after the hard lock window.');
}

function minutesUntil(target){
  const now = new Date();
  const [th,tm] = (target||'00:00').split(':').map(Number);
  const t = new Date(now); t.setHours(th,tm,0,0);
  let diff = Math.round((t-now)/60000);
  if(diff < -60) diff += 1440;
  return diff;
}
function pruneExpiredReminders(){
  const now = new Date();
  const before = S.reminders.length;
  S.reminders = S.reminders.filter(r=>{
    if(!r.date) return true;
    const end = new Date(r.date+'T'+(r.time||'23:59:59'));
    return end >= now;
  });
  return S.reminders.length !== before;
}
function checkSchedules(){
  pruneExpiredReminders();
  const now = new Date(); const hh = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  S.kids.forEach(k=>{
    if(k.active){ k.startingSoon=null; return; }
    k.startingSoon = null;
    if(k.schedule.studyOn){ const m=minutesUntil(k.schedule.studyStart); if(m>0&&m<=5) k.startingSoon={type:'study', mins:m}; }
    if(!k.startingSoon && k.schedule.bedOn){ const m=minutesUntil(k.schedule.bedStart); if(m>0&&m<=5) k.startingSoon={type:'bed', mins:m}; }
    if(k.schedule.studyOn && k.schedule.studyStart===hh){ k.active={type:'study', hrs:hoursBetween(k.schedule.studyStart,k.schedule.studyEnd), elapsed:0}; k.startingSoon=null; }
    else if(k.schedule.bedOn && k.schedule.bedStart===hh){ k.active={type:'bed', hrs:hoursBetween(k.schedule.bedStart,k.schedule.bedEnd), elapsed:0}; k.startingSoon=null; }
  });
  render();
}

function deliverAttendance(classIdx, session, arr){
  const cls = S.classes[classIdx];
  const c = k=>arr.filter(x=>x===k).length;
  const name = session==='AM'?'Morning':'Afternoon';
  const word = {P:'present',A:'absent',L:'late',E:'excused',C:'marked cut class'};
  cls.notes.unshift(name + ' check sent to parents: ' + c('P') + ' present, ' + c('A') + ' absent, ' + c('L') + ' late' + (c('E')?', '+c('E')+' excused':'') + (c('C')?', '+c('C')+' cut class':'') + '.');
  classKids(classIdx).forEach(k=>{
    if(arr[k.desk]==null) return;
    S.inbox.unshift({at:Date.now(), t:name+' attendance', b:k.name+' was marked '+word[arr[k.desk]]+' ('+name.toLowerCase()+' check).', warn: arr[k.desk]==='A'});
  });
  if(session==='PM' && cls.submitted.AM){
    const cut = arr.map((v,i)=>(v==='A' && cls.att.AM[i]!=='A')?i:-1).filter(i=>i>=0);
    if(cut.length){
      cls.notes.unshift('Cutting-class alert sent for desk' + (cut.length>1?'s ':' ') + cut.map(i=>i+1).join(', ') + ': here this morning, absent this afternoon.');
      classKids(classIdx).forEach(k=>{
        if(cut.includes(k.desk)) S.inbox.unshift({at:Date.now(), t:'Possible cutting class', b:k.name+' was in class this morning but is absent this afternoon.', warn:true});
      });
    }
  }
  checkRelease(classIdx);
}
function submitAtt(){
  const cls = myClass(); const classIdx = S.classes.indexOf(cls);
  const session = cls.session, arr = cls.att[session];
  cls.submitted[session] = true;
  const name = session==='AM'?'Morning':'Afternoon';
  if(S.online){
    deliverAttendance(classIdx, session, arr.slice());
    render(); say(name + ' attendance saved', arr.includes(null) ? 'Parents of marked students were notified. Empty seats were skipped.' : 'Parents were notified.');
  } else {
    cls.notes.unshift(name + ' attendance saved on this device (offline). Will notify parents once you\'re back online.');
    S.syncQueue.push(()=>deliverAttendance(classIdx, session, arr.slice()));
    render(); say(name + ' attendance saved offline','Parents will be notified once you\'re back online.');
  }
}

  return `<div class="m ${own?'s':'t'}"><small>${own?'You':esc(m.who)}</small>${esc(m.t)}</div>`;
}
function chatView(){

  const ctl = teacher ? `<div class="card"><div class="row"><div><h2>${tr("Online class")} · ${esc(cls.name)}</h2><p class="sub" style="margin:0">${tr("Starting a class locks the Vault on every student device.")}</p></div>

function toggleClass(){
  const cls = myClass();
  cls.classActive = !cls.classActive; render();
  say(cls.classActive?'Class started':'Class ended', cls.classActive?'The Vault locked non-educational apps on all student devices.':'The Vault released the class lock.');
}
function send(){
  const cls = chatClass(); if(!cls) return;
  const el = $('msg'); const t = el.value.trim(); if(!t) return;
  const tw = isTeacher(); cls.chat.push({w:tw?'t':'s', who:tw?displayName(S.user):kid().name, t}); render();
  $('msg').focus(); const v = $('view'); v.scrollTop = v.scrollHeight;
}
function sendQuick(emoji){
  const cls = chatClass(); if(!cls) return;
  const tw = isTeacher(); cls.chat.push({w:tw?'t':'s', who:tw?displayName(S.user):kid().name, t:emoji, kind:'emoji'}); render();
  const v = $('view'); v.scrollTop = v.scrollHeight;
}
function sendPhoto(input){
  const cls = chatClass(); if(!cls || !input.files || !input.files[0]) return;
  const file = input.files[0];
  if(!file.type.startsWith('image/')){ say('Not a photo', 'Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const tw = isTeacher(); cls.chat.push({w:tw?'t':'s', who:tw?displayName(S.user):kid().name, t:reader.result, kind:'photo'}); render();
    const v = $('view'); v.scrollTop = v.scrollHeight;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function openVideoCall(){
  const cls = chatClass(); if(!cls) return;
  S.modal='videocall'; render();
}

const clock = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});

function openSOS(){
  if(S.sos && S.sos.status==='active'){ S.sosDismissed[S.user]=false; render(); return; }
  S.sosDrill=false; S.modal='sos'; render();
}
let holdT = null;
function holdStart(e){
  e.preventDefault(); if(holdT) return;
  const t0 = Date.now();
  holdT = setInterval(()=>{
    const f = Math.min(1,(Date.now()-t0)/1500), bar = $('holdBar');
    if(bar) bar.style.width = (f*100)+'%';
    if(f>=1){ clearInterval(holdT); holdT=null; sendSOS(); }
  }, 40);
}
function holdEnd(){ if(holdT){ clearInterval(holdT); holdT=null; const b=$('holdBar'); if(b) b.style.width='0'; } }
function sendSOS(){
  const T = SOS_TYPES[S.sosType], from = S.user;
  const room = (from==='teacher'||from==='teacher2') ? S.classes.find(c=>c.teacherKey===from).name : 'Main office';
  S.sos = {type:S.sosType, drill:S.sosDrill, fromRole:from, fromName:displayName(from), room, at:Date.now(), status:'active', safe:Array(60).fill(false), acks:{}};
  S.sosDismissed = {}; S.modal = null;
  const pre = S.sos.drill ? 'Drill: ' : 'School emergency: ';
  S.inbox.unshift({at:Date.now(), t:pre+T.name, b:room+', sent by '+displayName(from)+' at '+clock(S.sos.at)+'. Follow the school\'s official instructions and avoid going to school unless told to.', warn:true});
  S.sosLog.unshift({t:(S.sos.drill?'Drill · ':'')+T.name+' · '+room, b:'Sent by '+displayName(from)+' at '+clock(S.sos.at)});
  S.announcements.unshift({t:pre+T.name, b:room+' — sent by '+displayName(from)+' at '+clock(S.sos.at)+'. Follow the school\'s official instructions.', at:Date.now(), kind:'sos'});
  S.newAnnouncement = true;

}
function imSafe(){

  return `<div class="sosfull${clear?' clear':''}${z.drill&&!clear?' drill':''}" role="alertdialog" aria-modal="true" aria-live="assertive">${drill}${body}${demo}</div>`;
}

function submitSignup(){
  const r=S.signup.role, f=S.form, bad=m=>{ S.signup.err=m; render(); };
  if(!(f.name||'').trim()) return bad('Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(f.email||'')) return bad('Enter a valid email address.');
  if((f.pw||'').length<6) return bad('Your password needs at least 6 characters.');
  if(r==='parent'){
    if(!(f.child||'').trim()) return bad("Enter your child's first name.");
    if(!/^\d{4}$/.test(f.pin||'')) return bad('Your PIN must be exactly 4 digits.');
    if(!f.consent) return bad('Please agree to the privacy summary to continue.');
    S.names.parent=f.name.trim(); PIN=f.pin; S.parentEmail=f.email.trim();
    S.kids = [newKid(f.child.trim(), f.age||'6-12', {})];
    S.activeKid = 0;
  } else if(r==='coparent'){
    if((f.famcode||'').trim().toUpperCase()!==familyCode) return bad("That invite code doesn't match. Ask the primary parent for it on their Vault screen.");
    S.names.parent2=f.name.trim();
  } else if(r==='teacher'){
    if((f.schoolCode||'').trim().toUpperCase()!=='SCH-2026') return bad("That school code doesn't match. Ask your principal for the code, or use the demo code SCH-2026.");
    if(!(f.cls||'').trim()) return bad('Enter your advisory section.');
    const newKey = 'teacher_'+Date.now();
    S.classes.push(newClass(f.cls.trim(), newKey, f.name.trim(), makeClassCode()));
    NAV[newKey] = [['school','Attendance'],['quiz','Quizzes'],['chat','Class'],['classSection','Class Section']];
    TITLES[newKey] = {school:'Attendance', quiz:'Quizzes', chat:'Class', classSection:'Class Section'};
    TITLES_FIL[newKey] = {school:'Pagdalo', quiz:'Mga Pagsusulit', chat:'Klase', classSection:'Seksyon ng Klase'};
    S.newTeacherKey = newKey;
  } else {
    const idx = S.kids.findIndex(k=>k.linkCode===(f.code||'').trim().toUpperCase());
    if(idx<0) return bad("That code doesn't match. Ask your parent for the link code on their Vault screen.");
    S.studentKidIndex = idx;
  }

  const loginAs = r==='coparent' ? 'parent2' : (r==='teacher' ? S.newTeacherKey : r);

}

  const f = S.forgot;
  if(!/^\S+@\S+\.\S+$/.test(f.email||'')){ f.err='Enter a valid email address.'; render(); return; }
  if(f.mode==='pin' && f.email.trim().toLowerCase() !== S.parentEmail.trim().toLowerCase()){ f.err="We don't have that email on this family account."; render(); return; }
  f.sentCode = String(100000 + Math.floor(Math.random()*900000));
  f.err=''; f.step=2; render();
  say('Code sent', 'In a real app this would be emailed to you. For this prototype, it\'s shown on screen below.');
}
function verifyResetCode(){
  const f = S.forgot;
  if((f.code||'').trim() !== f.sentCode){ f.err='That code doesn\'t match. Check the demo code below and try again.'; render(); return; }
  f.err=''; f.step=3; render();
}
function resetPin(){
  const f = S.forgot;
  if(!/^\d{4}$/.test(f.pin1||'')){ f.err='Your new PIN must be exactly 4 digits.'; render(); return; }
  if(f.pin1 !== f.pin2){ f.err="Those two PINs don't match."; render(); return; }
  PIN = f.pin1; f.err='';
  go('login');
  say('PIN reset', 'Your new PIN is ready to use.');
}
function resetPassword(){
  const f = S.forgot;
  if((f.pw1||'').length<6){ f.err='Your new password needs at least 6 characters.'; render(); return; }
  if(f.pw1 !== f.pw2){ f.err="Those two passwords don't match."; render(); return; }
  f.err='';
  go('login');
  say('Password reset', 'Your new password is ready to use.');
}
function forgotView(){
  const f = S.forgot;
  const isPw = f.mode==='password';
  const err = f.err ? `<div class="alertbox" role="alert">${esc(f.err)}</div>` : '';
  if(f.step===1) return `<button class="back" onclick="go('login')">‹ Back to sign in</button>
    <h1 style="font:800 28px/1.1 var(--head);margin:4px 0 6px">${tr("Reset your")} ${isPw?tr("password"):tr("PIN")}</h1>
    <p class="sub">Enter the email on your account and we'll send a reset code.</p>
    ${err}
    <label class="lab">Email<input class="field" type="email" name="forgotemail" value="${esc(f.email)}" placeholder="you@example.com" oninput="S.forgot.email=this.value" autocomplete="nope"></label>
    <button class="btn lock block" style="margin-top:16px;padding:14px" onclick="sendResetCode()">${tr("Send reset code")}</button>`;
  if(f.step===2) return `<button class="back" onclick="go('login')">‹ Back to sign in</button>
    <h1 style="font:800 28px/1.1 var(--head);margin:4px 0 6px">${tr("Enter the code")}</h1>
    <p class="sub">We sent a 6-digit code to ${esc(f.email)}.</p>
    ${err}
    <label class="lab">6-digit code<input class="field" type="text" inputmode="numeric" maxlength="6" name="resetcode" value="${esc(f.code)}" placeholder="000000" oninput="S.forgot.code=this.value" autocomplete="nope"></label>
    <p class="hint" style="margin-top:8px">Prototype only — no real email is sent. Demo code: <b>${esc(f.sentCode)}</b></p>
    <button class="btn lock block" style="margin-top:16px;padding:14px" onclick="verifyResetCode()">Verify code</button>`;
  if(isPw) return `<button class="back" onclick="go('login')">‹ Back to sign in</button>
    <h1 style="font:800 28px/1.1 var(--head);margin:4px 0 6px">Set a new password</h1>
    <p class="sub">Choose a new password (6+ characters) for your account.</p>
    ${err}
    <label class="lab">New password<input class="field" type="password" name="newpw1" value="${esc(f.pw1)}" oninput="S.forgot.pw1=this.value" autocomplete="nope"></label>
    <label class="lab">Confirm new password<input class="field" type="password" name="newpw2" value="${esc(f.pw2)}" oninput="S.forgot.pw2=this.value" autocomplete="nope"></label>
    <button class="btn lock block" style="margin-top:16px;padding:14px" onclick="resetPassword()">Save new password</button>`;
  return `<button class="back" onclick="go('login')">‹ Back to sign in</button>
    <h1 style="font:800 28px/1.1 var(--head);margin:4px 0 6px">Set a new PIN</h1>
    <p class="sub">Choose a new 4-digit PIN for your parent account.</p>
    ${err}
    <label class="lab">New PIN<input class="field" type="password" inputmode="numeric" maxlength="4" name="newpin1" value="${esc(f.pin1)}" oninput="S.forgot.pin1=this.value" autocomplete="nope"></label>
    <label class="lab">Confirm new PIN<input class="field" type="password" inputmode="numeric" maxlength="4" name="newpin2" value="${esc(f.pin2)}" oninput="S.forgot.pin2=this.value" autocomplete="nope"></label>
    <button class="btn lock block" style="margin-top:16px;padding:14px" onclick="resetPin()">Save new PIN</button>`;
}
function loginView(){
  const kidNames = S.kids.map(k=>esc(k.name)).join(' & ');
  const studentBtns = S.kids.map((k,i)=>`<button class="opt" onclick="signIn('student', ${i})"><b>${esc(k.name)}</b><span>${k.classId!=null?'Student, '+esc(S.classes[k.classId].name)+' — takes quizzes, chats with the teacher':'Views their own Vault and can ask a parent to unlock'}</span></button>`).join('');
  const teacherBtns = S.classes.map(c=>`<button class="opt" onclick="signIn('${c.teacherKey}')"><b>${esc(c.teacherName)} — ${esc(c.name)}</b><span>Teacher · attendance, quizzes, online classes, SOS · class code ${esc(c.code)}</span></button>`).join('');
  return `<button class="back" onclick="go('landing')">‹ Back</button>
  <h1 style="font:800 28px/1.1 var(--head);margin:4px 0 6px">${tr('Sign in')}</h1>
  <p class="sub">Demo accounts. Each role sees different screens, and changes carry across when you switch.</p>
  <button class="opt" onclick="askLoginPin('parent')"><b>${esc(S.names.parent)}</b><span>Parent/Guardian of ${kidNames} · PIN required${PIN==='1234'?' (demo PIN: 1234)':''} · controls the Vault, gets school alerts</span></button>
  <p style="margin:-6px 0 14px 4px"><button class="linklike" style="font-size:13px" onclick="startForgot('pin')">Forgot your PIN?</button></p>
  ${studentBtns}
  ${teacherBtns}
  <button class="opt" onclick="signIn('principal')"><b>${esc(S.names.principal)}</b><span>Principal · can end alerts and post announcements without a PIN</span></button>
  <button class="opt" onclick="signIn('vp')"><b>${esc(S.names.vp)}</b><span>Vice Principal · same admin powers as the Principal</span></button>
  <p class="hint" style="margin-top:14px">Real sign-in with passwords needs a backend. This previews who sees what.</p>`;
}
function bodyView(){
  const u = S.user, t = S.tab;
  if(u==='parent'||u==='parent2') return t==='home' ? homeView() : t==='filter' ? filterView() : t==='me' ? meView() : alertsView();
  if(u==='student') return t==='home' ? studentHome() : t==='quiz' ? takeView() : chatView();
  if(u==='principal'||u==='vp') return staffView();
  if(t==='classSection') return classSectionView();
  if(t==='school' && S.showExcuseLog) return excuseLogView();
  return t==='school' ? schoolView() : t==='quiz' ? builderView() : chatView();
}
function layers(keepPin){
  const oldOv = document.querySelector('.sosfull'); const keepScroll = oldOv ? oldOv.scrollTop : 0;
  document.querySelectorAll('.toast,.scrim,.sosfull').forEach(n=>n.remove());
  const t = document.createElement('div');
  t.innerHTML = modalView() + sosView() + (S.toast?`<div class="toast" role="status"><b>${esc(S.toast.title)}</b>${esc(S.toast.body)}</div>`:'');
  while(t.firstChild) $('phone').appendChild(t.firstChild);
  if(S.modal==='pin' && $('pinIn')){ $('pinIn').value = keepPin; $('pinIn').focus(); }
  const nv = document.querySelector('.sosfull'); if(nv) nv.scrollTop = keepScroll;
}
function render(){
  try{
    renderInner();
  }catch(err){
    const el = document.getElementById('view');
    if(el){
      el.innerHTML = '<div class="card" style="background:#FBE4E4;border:2px solid #C93B3B"><h2 style="color:#C93B3B">Something broke — please screenshot this</h2><p class="sub" style="white-space:pre-wrap;font-family:monospace;font-size:12px">'+String(err && (err.stack||err.message||err))+'</p></div>';
    }
    if(window.console && console.error) console.error('Render error:', err);
  }
}
function renderInner(){
  const keepPin = S.modal==='pin' && $('pinIn') ? $('pinIn').value : '';
  const st = $('view').scrollTop;
  if(!S.user){
    $('top').innerHTML = ''; $('view').innerHTML = S.screen==='signup' ? signupView() : S.screen==='login' ? loginView() : S.screen==='forgot' ? forgotView() : landingView(); $('view').scrollTop = 0; $('composeWrap').innerHTML = ''; $('tabs').innerHTML = '';
    layers(keepPin);
    return;
  }
  $('top').innerHTML = `<div><h1>${screenTitle(S.user,S.tab)}</h1><small>Lock &amp; Connect · ${who(S.user)}</small></div><div class="row" style="gap:8px">${prefsBtn()}${isTeacher()?onlineChip():''}${sosBtn()}<button class="chip" onclick="signOut()">${tr("Sign out")}</button></div>`;
  $('view').innerHTML = bodyView();
  $('view').scrollTop = st;
  $('composeWrap').innerHTML = S.tab==='chat' ? composeView() : '';
  $('tabs').innerHTML = NAV[S.user].map(([k,l])=>`<button ${S.tab===k?'aria-current="page"':''} onclick="setTab('${k}')">${navLabel(l)}${(isTeacher()&&k==='school'&&kid().perfRequested)?' <span class="navdot"></span>':''}</button>`).join('');
  layers(keepPin);
}
let focusedEl = null;
document.addEventListener('focusin', e => {
  const el = e.target;
  if(el.matches('input, textarea, select')){
    focusedEl = el;
    setTimeout(() => { el.scrollIntoView({block:'center', behavior:'smooth'}); }, 300);
  }
});
document.addEventListener('focusout', () => { focusedEl = null; });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => {
    if(focusedEl) setTimeout(() => { focusedEl.scrollIntoView({block:'center', behavior:'smooth'}); }, 100);
  });
}
render();
</script>
</body>
</html>
